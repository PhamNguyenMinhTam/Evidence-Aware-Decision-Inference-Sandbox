milestones:
  - {"title":"Milestone 0 — Environment Setup","description":"Tuần 1, P00 Repository & Environment Foundation. Mục tiêu: Tái lập một lần chạy từ checkout sạch. Sản phẩm: Biên bản môi trường và kết quả smoke test. Gate: Xác minh dry-run, mock và live trên mỗi máy khả dụng. Ghi rõ bằng chứng còn thiếu.\nETVM-PI: chuyển giao các bằng chứng và sản phẩm tái lập đã được xác minh."}
  - {"title":"Milestone 1 — Scientific and Data Foundation","description":"Tuần 2–3, P01 Scientific Research Foundation. Mục tiêu: Chốt câu hỏi và thiết kế có khả năng bác bỏ. Sản phẩm: Protocol và ghi chú toán học. Gate: Mỗi RQ có giả thuyết, biến, đối chứng, thước đo và giới hạn.\nTuần 4–5, P02 Data & Evidence Foundation. Mục tiêu: Xây dựng dữ liệu tách biệt văn bản và nhãn. Sản phẩm: Schema, rubric, tập JSONL và manifest phiên bản. Gate: Kiểm thử schema, kiểm tra rò rỉ và đối chiếu gán nhãn.\nETVM-PI: chuyển giao các bằng chứng và sản phẩm tái lập đã được xác minh."}
  - {"title":"Milestone 2 — Evidence and Temporal Reasoning","description":"Tuần 6, P03 Extraction Reliability. Mục tiêu: Đo độ tin cậy trích xuất quyết định và claim. Sản phẩm: Protocol, dự đoán và phân tích lỗi. Gate: Có so sánh regex/Ollama và báo mẫu số, lỗi API, hạn chế.\nTuần 7, P04 Evidence Grounding. Mục tiêu: Đo claim có nguồn định vị được và được hỗ trợ ngữ nghĩa. Sản phẩm: Bộ đối chứng grounding, chỉ số và ca lỗi. Gate: Đo riêng tính hợp lệ quote và hỗ trợ ngữ nghĩa trên tập có nhãn.\nTuần 8, P05 Temporal Consistency. Mục tiêu: Kiểm tra thứ tự trực tiếp, bắc cầu và chu trình. Sản phẩm: Bộ ca thời gian và so sánh closure. Gate: Tái lập kết quả trên chuỗi, thứ tự thiếu và chu trình đã gán nhãn.\nETVM-PI: chuyển giao các bằng chứng và sản phẩm tái lập đã được xác minh."}
  - {"title":"Milestone 3 — Uncertainty and Partial Inference","description":"Tuần 9, P06 Missing Evidence. Mục tiêu: Đánh giá tác động thiếu thông tin lên kết luận. Sản phẩm: Biến thể che nguồn và phân tích ghép cặp. Gate: Báo mức thiếu, coverage, set size và các vi phạm monotonicity.\nTuần 10, P07 Contradictory Evidence. Mục tiêu: Phân biệt thiếu, mâu thuẫn quyết định và mâu thuẫn thời gian. Sản phẩm: Taxonomy, corpus xung đột và đánh giá fallback. Gate: Kết quả phân biệt trạng thái và truy được nguồn gây xung đột.\nTuần 11, P08 Set-Valued Inference. Mục tiêu: Đo và giải thích các kết luận tương thích. Sản phẩm: Đặc tả, oracle hữu hạn và toy example thống kê. Gate: Giải tay và kiểm chứng máy, báo coverage cùng kích thước tập.\nETVM-PI: chuyển giao các bằng chứng và sản phẩm tái lập đã được xác minh."}
  - {"title":"Milestone 4 — Incremental Inference","description":"Tuần 12–13, P09 Incremental Inference. Mục tiêu: Đo tính đúng và chi phí theo chuỗi cập nhật. Sản phẩm: Oracle, runner update và benchmark đã warm-up. Gate: So khớp oracle từng prefix trước khi so hiệu năng.\nETVM-PI: chuyển giao các bằng chứng và sản phẩm tái lập đã được xác minh."}
  - {"title":"Milestone 5 — Robustness and Scientific Validation","description":"Tuần 14, P10 Robustness & Generalization. Mục tiêu: Đo độ nhạy với biến đổi theo cặp và domain. Sản phẩm: Biến thể kiểm định và biểu đồ chênh lệch. Gate: Kiểm tra nhãn trước khi chạy và báo riêng từng điều kiện.\nTuần 15, P11 Statistical Analysis & Scientific Validation. Mục tiêu: Kiểm tra độ tin cậy và khả năng tái lập của kết quả. Sản phẩm: Báo cáo thống kê, bảng lỗi và bản tái chạy. Gate: Kết luận truy được về run/commit/data và nêu bất định.\nETVM-PI: chuyển giao các bằng chứng và sản phẩm tái lập đã được xác minh."}
  - {"title":"Milestone 6 — ETVM-PI Research Transfer","description":"Tuần 16, P12 Research Transfer to ETVM-PI. Mục tiêu: Xác định phần có thể chuyển giao và khoảng trống còn mở. Sản phẩm: Transfer map, báo cáo và tự đánh giá readiness. Gate: Người thực hiện xác nhận bằng chứng và điều kiện nghiên cứu.\nETVM-PI: chuyển giao các bằng chứng và sản phẩm tái lập đã được xác minh. Bao gồm FINAL."}
issues:
  - {"id":"MASTER","title":"[MASTER] EADIS — Research & Development Roadmap","priority":"high","scope":"core","blocked_by":[],"kind":"master","overview":"EADIS là sandbox tiền nghiên cứu cho ETVM-PI. Mục tiêu là tách sai số extraction, provenance, thời gian, dữ liệu thiếu/mâu thuẫn, tập nghiệm và cập nhật gia tăng bằng đối chứng. Phạm vi gồm dữ liệu tổng hợp, Ollama độc lập và đánh giá có thể tái lập.\n\n**UNDERSTANDING > MEMORIZATION** · **SCIENTIFIC VALIDITY > SYSTEM COMPLEXITY** · **REPRODUCIBILITY > UNVERIFIED RESULTS**\n\n- Tuần 1 · P00 — Repository & Environment Foundation\n- Tuần 2–3 · P01 — Scientific Research Foundation\n- Tuần 4–5 · P02 — Data & Evidence Foundation\n- Tuần 6 · P03 — Extraction Reliability\n- Tuần 7 · P04 — Evidence Grounding\n- Tuần 8 · P05 — Temporal Consistency\n- Tuần 9 · P06 — Missing Evidence\n- Tuần 10 · P07 — Contradictory Evidence\n- Tuần 11 · P08 — Set-Valued Inference\n- Tuần 12–13 · P09 — Incremental Inference\n- Tuần 14 · P10 — Robustness & Generalization\n- Tuần 15 · P11 — Statistical Analysis & Scientific Validation\n- Tuần 16 · P12 — Research Transfer to ETVM-PI","labels":["type: master","priority: high","scope: core","status: not-started"]}
