[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-agent-experiments"
version = "0.1.0"
description = "EADIS, an experimental sandbox for evidence-aware decision inference"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3", "pydantic==2.12.3", "python-dotenv==1.2.1"]

[project.optional-dependencies]
dev = ["pytest==9.0.1", "ruff==0.14.4"]

[project.scripts]
llm-experiment = "scripts.run_experiment:main"
eadis = "eadis.cli:main"

[tool.setuptools.packages.find]
include = ["eadis*", "agents*", "controller*", "evaluation*", "scripts*", "mini_mos*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/coding_agent/tests", "apps/evidence_agent/tests"]
pythonpath = ["."]
